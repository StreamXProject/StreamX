name: Build StreamX
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      existing_run_id:
        description: 'Optional successful Build StreamX run ID to publish without rebuilding'
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: streamx-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    if: github.event_name != 'workflow_dispatch' || inputs.existing_run_id == ''
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android toolchain
        run: sdkmanager "platforms;android-36" "platforms;android-37.0" "build-tools;36.0.0" "ndk;27.0.12077973" "cmake;3.22.1"
      - uses: gradle/actions/setup-gradle@v4
      - name: Configure release signing
        if: github.event_name != 'pull_request'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: python3 .github/scripts/configure-signing.py
      - name: Build ARM64 release APK
        run: ./gradlew --no-daemon --max-workers=2 -PstreamxAbis=arm64-v8a :app:assembleProdRelease
      - name: Upload ARM64 APK
        uses: actions/upload-artifact@v4
        with:
          name: StreamX-arm64-v8a-release
          path: app/build/outputs/apk/prod/release/app-prod-arm64-v8a-release.apk
          if-no-files-found: error
      - name: Run unit tests
        run: ./gradlew --no-daemon --max-workers=2 -PstreamxAbis=arm64-v8a :app:testProdReleaseUnitTest
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: StreamX-test-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
  publish:
    name: Publish manual build
    needs: build
    if: always() && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && (needs.build.result == 'success' || (needs.build.result == 'skipped' && inputs.existing_run_id != ''))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Resolve tested build
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EXISTING_RUN_ID: ${{ inputs.existing_run_id }}
        shell: python
        run: |
          import base64, datetime, json, os, re, subprocess
          run_id = os.environ['EXISTING_RUN_ID'] or os.environ['GITHUB_RUN_ID']
          if not run_id.isdigit():
              raise SystemExit('Run ID must be a number')
          run = json.loads(subprocess.check_output([
              'gh', 'api', f"repos/{os.environ['GH_REPO']}/actions/runs/{run_id}"
          ]))
          if os.environ['EXISTING_RUN_ID']:
              if (run['conclusion'] != 'success' or run['head_branch'] != 'main'
                      or run['path'] != '.github/workflows/build.yml'
                      or run['event'] not in ('push', 'workflow_dispatch')):
                  raise SystemExit('Only successful main-branch host builds can be published')
              sha = run['head_sha']
          else:
              sha = os.environ['GITHUB_SHA']
          source = json.loads(subprocess.check_output([
              'gh', 'api', f"repos/{os.environ['GH_REPO']}/contents/app/build.gradle.kts?ref={sha}"
          ]))
          gradle = base64.b64decode(source['content']).decode()
          match = re.search(r'versionName\s*=\s*"([0-9]+(?:\.[0-9]+)+)"', gradle)
          if not match:
              raise SystemExit('Could not read the app release version')
          version = match.group(1)
          stamp = datetime.datetime.fromisoformat(run['created_at'].replace('Z', '+00:00')).strftime('%Y%m%d%H%M%S')
          tag = f'v{version}-preview.{stamp}'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f'run_id={run_id}\nsha={sha}\nversion={version}\ntag={tag}\n')
      - name: Download tested APK
        uses: actions/download-artifact@v4
        with:
          name: StreamX-arm64-v8a-release
          path: release
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Publish APK to Releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.source.outputs.tag }}
          APP_VERSION: ${{ steps.source.outputs.version }}
          COMMIT_SHA: ${{ steps.source.outputs.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ steps.source.outputs.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          apk="StreamX-arm64-v8a.apk"
          mv release/app-prod-arm64-v8a-release.apk "release/$apk"
          (cd release && sha256sum "$apk" > SHA256SUMS.txt)
          cat > release/notes.md <<EOF
          Tested ARM64 build of StreamX for Android 8.0+.

          Download **$apk** below and install it directly. The APK uses the existing release signing key.

          Built from commit \`$COMMIT_SHA\`. Release build and unit tests passed in [GitHub Actions]($RUN_URL).

          This build keeps the app version declared in Gradle. It is published separately from numbered stable releases.
          EOF
          # Keep the source tag exact while using the default branch for the
          # release API's workflow-permission check (also applies to old runs).
          if ! gh api "repos/$GH_REPO/git/ref/tags/$tag" > /dev/null 2>&1; then
            gh api "repos/$GH_REPO/git/refs" -f "ref=refs/tags/$tag" -f "sha=$COMMIT_SHA"
          fi
          tagged_sha=$(gh api "repos/$GH_REPO/git/ref/tags/$tag" --jq '.object.sha')
          test "$tagged_sha" = "$COMMIT_SHA"
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" "release/$apk" release/SHA256SUMS.txt --clobber
          else
            gh release create "$tag" "release/$apk" release/SHA256SUMS.txt \
              --verify-tag --title "StreamX $APP_VERSION Preview" \
              --prerelease --notes-file release/notes.md
          fi
      - name: Record public release tag
        env:
          RELEASE_TAG: ${{ steps.source.outputs.tag }}
        run: printf '%s\n' "$RELEASE_TAG" > public-release-tag.txt
      - name: Upload public release tag
        uses: actions/upload-artifact@v4
        with:
          name: public-release-tag
          path: public-release-tag.txt
          if-no-files-found: error
