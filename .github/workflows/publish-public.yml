name: Mirror legacy Automix packages
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Automix package tag (automix-N)'
        required: true
        type: string
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Mirror Automix package
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          GH_SOURCE_TOKEN: ${{ github.token }}
          GH_PUBLIC_TOKEN: ${{ secrets.PUBLIC_RELEASE_TOKEN }}
        run: |
          [[ "$RELEASE_TAG" =~ ^automix-[1-9][0-9]*$ ]] || exit 1
          python3 .github/scripts/publish-public.py
